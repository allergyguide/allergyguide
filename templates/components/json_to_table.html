{% component json_to_table(show_headers=true) %}
{% set show_headers = show_headers | default(value=true) %}
<div class="json_to_table json-table-container" data-json="{{ body | replace(from='\n', to=' ') | escape }}" data-show-headers="{{ show_headers }}"></div>
<script src="/js/json_to_table.js" defer></script>
{% endcomponent json_to_table %}
