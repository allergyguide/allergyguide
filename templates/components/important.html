{% component important(header) %}
<blockquote class="important">
{%- set icon = load_data(path="static/icon/important.svg") -%}
<div class="icon"><span>{{ icon | safe }}{% if header %}<strong>{{ header }}</strong>{% endif %}</span></div>
<div class="content">
{{ body | markdown | safe }}
</div>
</blockquote>
{% endcomponent important %}
