{% component med_index() %}
{% if not med_script_loaded %}
{% set_global med_script_loaded = true %}
{% set data = load_data(path="static/toml/medications.json") %}
<script type="application/json" id="med-database-json" data-json="{{ data | json_encode() | escape_html }}"></script>
{% set tools = load_data(path="static/js/tools_versioning.json") %}
<script type="module" src="/js/{{ tools.medications.file }}"></script>
{% endif %}
<div id="med-index-mount"></div>
{% endcomponent med_index %}
