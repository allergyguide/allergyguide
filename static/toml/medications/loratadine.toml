[loratadine]

# =====================================================================
# METADATA & HEADER
# =====================================================================

display_name = "Loratadine"
otc = "yes"
draft = true
categories = ["antihistamine"]
abbreviations = "AR-allergic rhinitis; CU-chronic urticaria; ODT-orally disintegrating tablet"
brand_names = ["Claritin"]

authors.primary = "JY"
