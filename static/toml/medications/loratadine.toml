side_effects_source = "Monograph Table 1 (adults, 10mg OD vs placebo) and Table 3 (pediatric, oral solution)."
half_life = "Loratadine 7.8-11 hrs; active metabolite 17-24 hrs"

contraindications = "None beyond hypersensitivity"

available_forms = ["10mg tab", "10mg or 5mg ODT", "1mg/mL oral solution"]
estimated_cost = "~$32 / 30 tabs (generic, BC formulary price)"
interactions_summary = "No clinically significant drug interactions have been found."
severe_interactions = ""
pearls = [
  "ODT: take on an empty stomach",
  "No renal dose adjustments",
  "Off-label can increase dose to 4x the regular daily dose",
]

monograph_links = [
  "https://assets.allergyguide.ca/monographs/loratadine-2020-04.pdf",
]

